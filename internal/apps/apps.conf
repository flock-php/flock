# Templates for `flock app create <name> --type <template>`.
# Each key becomes an available --type value:
#   (empty)     create an empty directory
#   index.php   create a starter index.php
#   http(s)://  download and extract a .tar.gz, .tgz, or .zip archive
#   <path>      extract a local .tar.gz, .tgz, or .zip archive
# Append `| db` to require a running MySQL or MariaDB service.

blank=
php=index.php
wordpress=https://wordpress.org/latest.tar.gz | db
