# main (and maintenance branches like 1.x): release-please keeps a release PR open with the next
# version and changelog from the conventional commits. "Merge when ready" puts it in the merge queue,
# which builds and signs it (build.yml) and merges it only once those builds pass. Merging it tags
# the release, and the merge queue's builds are attached to it, without building again. Then the
# release goes into the apps' update feed.
#
# Betas are released from the same branch with beta.yml.
#
# Off while the repository is private: the merge queue and environments need a paid plan there.
name: Release

on:
  push:
    branches: [main, "*.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    # A manual start on a feature branch does nothing.
    if: >-
      !github.event.repository.private &&
      (github.ref_name == 'main' || endsWith(github.ref_name, '.x'))
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is a secret of this environment, so only main and 1.x get it.
    environment: release
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Anyone with write access can start a workflow; only admins may release.
      - name: Check who started it
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::only admins can run this, not $ACTOR ($permission)" && exit 1
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # RELEASE_PLEASE_TOKEN (a fine-grained PAT) is needed: the release PR must start build.yml's
          # tests (required to enter the merge queue), and PRs created with the default GITHUB_TOKEN
          # don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # The successful build.yml run of the merge queue whose code is exactly what was tagged.
  find-builds:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          want=$(tree "$TAG")
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --event merge_group \
            --status success --limit 30 --json databaseId,headSha \
            --jq '.[] | "\(.databaseId) \(.headSha)"' |
          while read -r id sha; do
            if [ "$(tree "$sha")" = "$want" ]; then
              echo "Using the builds of run $id ($sha)"
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              break
            fi
          done

  # Only when the merge queue's builds can't be found (e.g. merged past the queue).
  build:
    needs: [release-please, find-builds]
    if: needs.find-builds.outputs.run_id == ''
    permissions:
      contents: read
      # Windows signing's Azure login.
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}
    # The "release" environment's signing secrets: a called workflow sees them only when passed on.
    secrets: inherit

  publish:
    name: Attach builds to the release
    needs: [release-please, find-builds, build]
    if: always() && needs.find-builds.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    # SPARKLE_PRIVATE_KEY, which signs the macOS update, and REPO_SIGNING_KEY, Linux's repository.
    environment: release
    permissions:
      actions: read
      contents: write
    concurrency:
      # One writer of the update feed at a time (beta.yml writes it too).
      group: update-feed
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find-builds.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: ./.github/actions/linux-repo
        with:
          mode: sign
          version: ${{ needs.release-please.outputs.version }}
          signing-key: ${{ secrets.REPO_SIGNING_KEY }}
          token: ${{ github.token }}

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ls dist
          for f in "dist/Flock-$VERSION-macOS.dmg" "dist/Flock-Setup-$VERSION-x64.exe"; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done
          # Linux: a .deb and an .rpm for each architecture.
          [ "$(ls dist/flockphp*.deb dist/flockphp*.rpm 2>/dev/null | wc -l)" -eq 4 ] || { echo "::error::Linux packages missing"; ls dist; exit 1; }
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"

      - uses: ./.github/actions/update-feed
        with:
          version: ${{ needs.release-please.outputs.version }}
          notes: ${{ runner.temp }}/notes.md
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          token: ${{ github.token }}

      - uses: ./.github/actions/linux-repo
        with:
          mode: index
          version: ${{ needs.release-please.outputs.version }}
          signing-key: ${{ secrets.REPO_SIGNING_KEY }}
          token: ${{ github.token }}

  # A job of its own: the release is out either way, and a failed AUR push can run again from here.
  aur:
    name: AUR
    needs: [release-please, publish]
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    # AUR_SSH_KEY, which pushes to the AUR packages.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Download the .debs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'flockphp_*.deb' --dir dist

      - uses: ./.github/actions/aur
        with:
          version: ${{ needs.release-please.outputs.version }}
          ssh-key: ${{ secrets.AUR_SSH_KEY }}
          token: ${{ github.token }}
