# main (and maintenance branches like 1.x): release-please keeps a draft release PR open with the
# next version and changelog from the conventional commits. Marking it ready for review builds it
# (build.yml), and branch protection keeps it unmerged until those builds pass. Merging it tags the
# release, and the builds of the merged code are attached to it, without building again.
#
# Off while the repository is private: draft PRs and branch protection need a paid plan there.
name: Release

on:
  push:
    branches: [main, "*.x"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release-please:
    # A manual start on a feature branch does nothing.
    if: >-
      !github.event.repository.private &&
      (github.ref_name == 'main' || endsWith(github.ref_name, '.x'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # RELEASE_PLEASE_TOKEN (a fine-grained PAT) is needed: the release PR must start build.yml,
          # and PRs created with the default GITHUB_TOKEN don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}

  # The successful build.yml run of the release PR whose code is exactly what was tagged.
  find-builds:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" --jq .commit.tree.sha; }
          want=$(tree "$TAG")
          gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --event pull_request \
            --status success --limit 30 --json databaseId,headSha,headBranch \
            --jq '.[] | select(.headBranch | startswith("release-please--")) | "\(.databaseId) \(.headSha)"' |
          while read -r id sha; do
            if [ "$(tree "$sha")" = "$want" ]; then
              echo "Using the builds of run $id ($sha)"
              echo "run_id=$id" >> "$GITHUB_OUTPUT"
              break
            fi
          done

  # Only when the release PR's builds can't be found (e.g. merged without them).
  build:
    needs: [release-please, find-builds]
    if: needs.find-builds.outputs.run_id == ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      version: ${{ needs.release-please.outputs.version }}

  publish:
    name: Attach builds to the release
    needs: [release-please, find-builds, build]
    if: always() && needs.find-builds.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          run-id: ${{ needs.find-builds.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ls dist
          for f in "dist/Flock-$VERSION-macOS.dmg" "dist/Flock-Setup-$VERSION-x64.exe"; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
