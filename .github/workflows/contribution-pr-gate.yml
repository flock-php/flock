# Outside contributors open an issue first; a PR from them stays open only when it targets main
# and links an open issue in this repository with a closing keyword or the Development sidebar that a maintainer has approved for it.
# An assigned issue accepts only its assignees. An unassigned `help wanted` issue accepts the
# first processed referenced PR, which receives durable `claimed` before milestone transfer.
# A PR that changes only files in docs/ needs no issue; it's checked again on every push, so it
# can't pick up other changes later.
# Every other PR from a non-collaborator is closed with a comment pointing at CONTRIBUTING.md.
# Keep Settings > General > Pull requests at "All users"; this workflow does the gating.
name: PR gate

concurrency:
    group: contribution-pr-gate-${{ github.repository }}
    queue: max

on:
  # pull_request_target, so the token can comment on and close PRs from forks. It never checks
  # out or runs the PR's code.
  pull_request_target:
    # "edited": a PR's base can change after it opens, and a gate-closed PR can add an approved
    # issue to its description. "synchronize": a docs-only PR can get other changes pushed to it.
    types: [ opened, reopened, edited, synchronize, closed ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Approved issue
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs from the default branch. Check out the same trusted ref; never
      # check out or run pull request code here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Release
        run: go run ./tools/github pr release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Gate
        run: go run ./tools/github pr gate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Claim
        run: go run ./tools/github pr claim
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Milestone
        run: go run ./tools/github pr milestone
        env:
          GITHUB_TOKEN: ${{ github.token }}
