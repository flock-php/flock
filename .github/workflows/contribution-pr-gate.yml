# Outside contributors open an issue first; a PR from them stays open only when it targets main
# and references an open issue, here or in flock-php/binaries, that a maintainer has approved for it:
#   - labelled "help wanted": anyone may send a PR for it, or
#   - assigned to the PR's author: only they may (only maintainers can assign issues).
# A PR that changes only files in docs/ needs no issue; it's checked again on every push, so it
# can't pick up other changes later.
# Every other PR from a non-collaborator is closed with a comment pointing at CONTRIBUTING.md.
# Keep Settings > General > Pull requests at "All users"; this workflow does the gating.
name: PR gate

on:
  # pull_request_target, so the token can comment on and close PRs from forks. It never checks
  # out or runs the PR's code.
  pull_request_target:
    # "edited": a PR's base can change after it opens, and a gate-closed PR can add an approved
    # issue to its description. "synchronize": a docs-only PR can get other changes pushed to it.
    types: [ opened, reopened, edited, synchronize ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    name: Approved issue
    runs-on: ubuntu-latest
    steps:
      # pull_request_target runs from the default branch. Check out the same trusted ref; never
      # check out or run pull request code here.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Evaluate
        run: go run ./tools/github pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
