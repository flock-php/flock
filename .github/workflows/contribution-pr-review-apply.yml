name: Apply PR Review Signal

on:
    workflow_run:
        workflows: [ PR Review Signal ]
        types: [ completed ]

permissions:
    actions: read
    contents: read
    pull-requests: read
    issues: write

# Queue every label write for one pull request. A later run must not replace a pending review request.
# workflow_run has no pull request number for forks, so the key is the head repository and branch.
# Both review-label workflows include those fields.
concurrency:
    group: pr-review-${{ github.event.pull_request.head.repo.owner.login || github.event.workflow_run.head_repository.owner.login }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
    queue: max

jobs:
    apply:
        name: Apply Label
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ github.event.repository.default_branch }}

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod

            -   name: Check Review Signal
                id: signal
                env:
                    GH_TOKEN: ${{ github.token }}
                #language=bash
                run: |
                    set -euo pipefail
                    count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/artifacts" --jq '[.artifacts[] | select(.name == "pr-review-event" and .expired == false)] | length')
                    if [ "$count" = "0" ]; then
                        echo "present=false" >> "$GITHUB_OUTPUT"
                    else
                        echo "present=true" >> "$GITHUB_OUTPUT"
                    fi

            # Do not extract the artifact into the workspace. It comes from pull request code and must not overwrite tools/github.
            -   uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
                if: steps.signal.outputs.present == 'true'
                with:
                    name: pr-review-event
                    path: ${{ runner.temp }}/pr-review-event
                    github-token: ${{ github.token }}
                    repository: ${{ github.repository }}
                    run-id: ${{ github.event.workflow_run.id }}

            -   name: Apply PR Review
                if: steps.signal.outputs.present == 'true'
                run: go run ./tools/github pr-review
                env:
                    GITHUB_TOKEN: ${{ github.token }}
                    PR_REVIEW_EVENT_PATH: ${{ runner.temp }}/pr-review-event/pr-review-event.json
