# Renders the apps' windows with demo data for the website's docs (windows/FlockScreenshots,
# macos/Sources/FlockScreenshots) and keeps the PNGs as run artifacts, by hand from the Actions
# tab. A workflow of its own, so these files never mix with the build artifacts that beta.yml and
# release.yml publish.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Render
        run: |
          dotnet build windows/FlockScreenshots -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem windows/FlockScreenshots/bin/x64/Release -Recurse -Filter FlockScreenshots.exe | Select-Object -First 1
          & $exe.FullName --out screenshots
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows
          path: screenshots/*.png
          if-no-files-found: error

  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # A debug build: FlockScreenshots reaches the app's views through @testable import.
      - name: Render
        run: swift run --package-path macos FlockScreenshots --out screenshots

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-macos
          path: screenshots/*.png
          if-no-files-found: error
