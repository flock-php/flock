# Runs the Go tests, and builds the macOS disk image (signed and notarized) and the Windows installer
# (signed with Artifact Signing) and keeps them as run artifacts. Signing takes the secrets and
# variables of the "release" environment, and is required in the merge queue and for releases.
#
#   - on every pull request: the Go tests only; the builds are skipped (which counts as passed)
#   - in the merge queue: everything, named with the version in .release-please-manifest.json. These
#     are the checks that must pass before a PR (the release PR) is merged, and release.yml attaches
#     these very files to the release.
#   - by hand from the Actions tab (any branch): unsigned, named dev-<commit>
#   - from release.yml, only when it cannot find the merge queue's builds
name: Build

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag); defaults to the triggering ref.
        type: string
        default: ""
      version:
        description: Version to stamp into the builds (e.g. 1.2.0).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A newer push to a PR replaces the tests of the older one.
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$EVENT" = merge_group ]; then
            # The release PR's new version; any other PR keeps the last released one.
            version=$(jq -r '."." // empty' .release-please-manifest.json)
            version="${version:-dev-$(git rev-parse --short HEAD)}"
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::no version found" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The Go tests on both platforms Flock supports (the race detector needs cgo, so macOS only).
  go-test:
    name: Go tests (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, flags: -race }
          - { name: Windows, os: windows-2025, flags: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${{ matrix.flags }} ./...

  macos:
    name: macOS (Apple silicon)
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    # Holds the signing secrets; only what may be released runs in it (builds by hand stay unsigned).
    environment: ${{ (github.event_name == 'merge_group' || inputs.version != '') && 'release' || '' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: swift test --package-path macos

      # Builds by hand may be ad-hoc signed; what gets released may not.
      - name: Require signing
        if: env.SIGNING != 'true' && (github.event_name == 'merge_group' || inputs.version != '')
        run: echo "::error::the MACOS_* signing secrets are not set" && exit 1

      # Into a keychain of its own; build-app.sh signs with $SIGN_IDENTITY and notarizes with the
      # API key at $NOTARY_KEY_PATH.
      - name: Set up signing
        if: env.SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate certificate, in case the runner image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build app and disk image
        run: |
          macos/build-app.sh
          mv build/macos/Flock.dmg "build/macos/Flock-$VERSION-macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: flock-macos
          path: build/macos/Flock-*-macOS.dmg
          if-no-files-found: error

      - name: Clean up signing
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  windows:
    name: Windows (x64)
    needs: version
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    # As for macOS: the signing variables, and what Azure's federated credential trusts.
    environment: ${{ (github.event_name == 'merge_group' || inputs.version != '') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      FLOCK_VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ vars.ARTIFACT_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Require signing
        if: env.SIGNING != 'true' && (github.event_name == 'merge_group' || inputs.version != '')
        run: echo "::error::the ARTIFACT_SIGNING_* variables are not set" && exit 1

      # No secret: Azure trusts this repository's "release" environment (a federated credential).
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        if: env.SIGNING == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # SignTool's Artifact Signing plugin and its settings; windows/sign.ps1 signs with them.
      - name: Set up signing
        if: env.SIGNING == 'true'
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $client = "$env:RUNNER_TEMP\artifact-signing"
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.146/microsoft.artifactsigning.client.1.0.146.nupkg -OutFile "$client.zip"
          if ((Get-FileHash "$client.zip" -Algorithm SHA256).Hash -ne "7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70") {
            throw "unexpected Microsoft.ArtifactSigning.Client package"
          }
          Expand-Archive "$client.zip" $client
          # Signs as the Azure CLI login above, nothing else.
          @{
            Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE
            ExcludeCredentials = @("EnvironmentCredential", "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential", "VisualStudioCodeCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential", "InteractiveBrowserCredential")
          } | ConvertTo-Json | Set-Content "$client\metadata.json"
          # Takes the token now, while GitHub's short-lived ID token behind the login is still valid;
          # the CLI keeps it for the signing after the build.
          az account get-access-token --resource https://codesigning.azure.net --output none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SIGN_DLIB=$client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "SIGN_METADATA=$client\metadata.json" >> $env:GITHUB_ENV

      - name: Build installer
        run: |
          ./windows/build-installer.ps1
          Move-Item windows/dist/Flock-Setup-x64.exe "windows/dist/Flock-Setup-$env:FLOCK_VERSION-x64.exe"

      - name: Verify signature
        if: env.SIGNING == 'true'
        run: |
          $signature = Get-AuthenticodeSignature windows/dist/Flock-Setup-*-x64.exe
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne "Valid") { throw "the installer's signature is $($signature.Status)" }

      - uses: actions/upload-artifact@v7
        with:
          name: flock-windows
          path: windows/dist/Flock-Setup-*-x64.exe
          if-no-files-found: error
