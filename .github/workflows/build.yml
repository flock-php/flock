# Runs the Go tests, and builds the unsigned macOS disk image and Windows installer and keeps them
# as run artifacts.
#
#   - by hand from the Actions tab (any branch): named dev-<commit>
#   - on the release PR once it is marked ready for review (not while it is a draft), and again on
#     every update to it: named with the PR's version. These are the checks that must pass before
#     the release PR can be merged, and release.yml attaches these very files to the release.
#   - from release.yml, only when it cannot find the release PR's builds
name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag); defaults to the triggering ref.
        type: string
        default: ""
      version:
        description: Version to stamp into the builds (e.g. 1.2.0).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A newer push to the release PR replaces a build of the older one.
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    # Of all pull requests, only the release PR is built, and only once it is out of draft.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$EVENT" = pull_request ]; then
            version=$(jq -r '."."' .release-please-manifest.json)
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::no version found" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The Go tests on both platforms Flock supports (the race detector needs cgo, so macOS only).
  go-test:
    name: Go tests (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, flags: -race }
          - { name: Windows, os: windows-2025, flags: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${{ matrix.flags }} ./...

  macos:
    name: macOS (Apple silicon)
    needs: version
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: swift test --package-path macos

      - name: Build app and disk image
        run: |
          macos/build-app.sh
          mv build/macos/Flock.dmg "build/macos/Flock-$VERSION-macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: flock-macos
          path: build/macos/Flock-*-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-2025
    env:
      FLOCK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: |
          ./windows/build-installer.ps1
          Move-Item windows/dist/Flock-Setup-x64.exe "windows/dist/Flock-Setup-$env:FLOCK_VERSION-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: flock-windows
          path: windows/dist/Flock-Setup-*-x64.exe
          if-no-files-found: error
