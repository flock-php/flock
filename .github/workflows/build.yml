# Runs the Go tests, and builds the macOS disk image (signed and notarized when the MACOS_* secrets
# are set, required for the release PR and releases) and the unsigned Windows installer and keeps
# them as run artifacts.
#
#   - by hand from the Actions tab (any branch): named dev-<commit>
#   - on the release PR once it is marked ready for review (not while it is a draft), and again on
#     every update to it: named with the PR's version. These are the checks that must pass before
#     the release PR can be merged, and release.yml attaches these very files to the release.
#   - from release.yml, only when it cannot find the release PR's builds
name: Build

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (a release tag); defaults to the triggering ref.
        type: string
        default: ""
      version:
        description: Version to stamp into the builds (e.g. 1.2.0).
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A newer push to the release PR replaces a build of the older one.
  group: build-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  version:
    # Of all pull requests, only the release PR is built, and only once it is out of draft.
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.head_ref, 'release-please--') && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          elif [ "$EVENT" = pull_request ]; then
            version=$(jq -r '."."' .release-please-manifest.json)
          else
            version="dev-$(git rev-parse --short HEAD)"
          fi
          if [ -z "$version" ] || [ "$version" = null ]; then
            echo "::error::no version found" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The Go tests on both platforms Flock supports (the race detector needs cgo, so macOS only).
  go-test:
    name: Go tests (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-26, flags: -race }
          - { name: Windows, os: windows-2025, flags: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ${{ matrix.flags }} ./...

  macos:
    name: macOS (universal)
    needs: version
    runs-on: macos-26
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: swift test --package-path macos

      # Builds by hand may be ad-hoc signed; what gets released may not.
      - name: Require signing
        if: env.SIGNING != 'true' && (github.event_name == 'pull_request' || inputs.version != '')
        run: echo "::error::the MACOS_* signing secrets are not set" && exit 1

      # Into a keychain of its own; build-app.sh signs with $SIGN_IDENTITY and notarizes with the
      # API key at $NOTARY_KEY_PATH.
      - name: Set up signing
        if: env.SIGNING == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          # The intermediate certificate, in case the runner image lacks it.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary-key.p8"
            echo "NOTARY_KEY_ID=$NOTARY_KEY_ID"
            echo "NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build app and disk image
        run: |
          macos/build-app.sh
          mv build/macos/Flock.dmg "build/macos/Flock-$VERSION-macOS.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: flock-macos
          path: build/macos/Flock-*-macOS.dmg
          if-no-files-found: error

      - name: Clean up signing
        if: always() && env.SIGNING == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary-key.p8"

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-2025
    env:
      FLOCK_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: |
          ./windows/build-installer.ps1
          Move-Item windows/dist/Flock-Setup-x64.exe "windows/dist/Flock-Setup-$env:FLOCK_VERSION-x64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: flock-windows
          path: windows/dist/Flock-Setup-*-x64.exe
          if-no-files-found: error
