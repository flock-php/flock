# Releases a tested beta as stable: "Run workflow" with its tag (empty: the newest beta), or
# `gh workflow run promote.yml -f tag=v1.1.0-beta.3`.
#
# It opens a PR from promote/<tag> (a branch at exactly that beta) into main, or into its
# maintenance branch for a beta of one (1.x). Merging it brings in
# the beta's commits, and release-please's release PR then shows the stable version (1.1.0) and
# its changelog; merging that releases it. The stable release is exactly the beta that was tested,
# even when develop has moved on since.
#
# Merge it with a merge commit (the merge queue's method), never squashed: release-please reads
# the changelog from its commits, and develop and main must keep sharing their history.
name: Promote beta

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The beta to release as stable, e.g. v1.1.0-beta.3 (empty for the newest)
        required: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    # RELEASE_PLEASE_TOKEN is a secret of this environment, so only main, develop and 1.x get it.
    environment: release
    steps:
      # Anyone with write access can start a workflow; only admins may release.
      - name: Check who started it
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::only admins can run this, not $ACTOR ($permission)" && exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pushes and opens the PR as the token's owner: with the default token, the PR wouldn't
          # start the checks it needs to enter the merge queue.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            TAG=$(git tag --list 'v*-beta.*' --sort=-v:refname | head -1)
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]] || ! git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::no beta tag \"$TAG\"" && exit 1
          fi
          version=${TAG#v}

          # A beta of develop goes to main; one of a maintenance branch (1.x) back to that branch.
          if git merge-base --is-ancestor "$TAG" origin/develop; then
            base=main
          elif git rev-parse -q --verify "origin/${version%%.*}.x" > /dev/null && git merge-base --is-ancestor "$TAG" "origin/${version%%.*}.x"; then
            base=${version%%.*}.x
          else
            echo "::error::$TAG is neither on develop nor on ${version%%.*}.x" && exit 1
          fi
          if git merge-base --is-ancestor "$TAG" "origin/$base"; then
            echo "::error::$TAG is already in $base" && exit 1
          fi

          branch="promote/$TAG"
          git push origin "$TAG^{commit}:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$branch" \
            --title "chore: promote $version to stable" \
            --body "Brings beta $TAG into $base. Once merged (with a merge commit), release-please's release PR shows the stable version; merging that releases exactly this beta."
