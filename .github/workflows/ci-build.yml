# Runs shared checks and delegates platform work while keeping one build run for release artifacts.
name: Build

on:
    workflow_dispatch:
    pull_request:
    merge_group:
    workflow_call:
        inputs:
            ref:
                description: Git ref to build (a release tag); defaults to the triggering ref.
                type: string
                default: ""
            version:
                description: Version to stamp into the builds (for example, 1.2.0).
                type: string
                default: ""

permissions:
    contents: read

concurrency:
    group: build-${{ github.event.pull_request.number || github.run_id }}
    cancel-in-progress: true

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   name: Version
                id: version
                env:
                    INPUT_VERSION: ${{ inputs.version }}
                    EVENT: ${{ github.event_name }}
                #language=bash
                run: |
                    if [ -n "$INPUT_VERSION" ]; then
                      version="$INPUT_VERSION"
                    elif [ "$EVENT" = merge_group ]; then
                      version=$(jq -r '."." // empty' .release-please-manifest.json)
                      version="${version:-dev-$(git rev-parse --short HEAD)}"
                    else
                      version="dev-$(git rev-parse --short HEAD)"
                    fi
                    if [ -z "$version" ] || [ "$version" = null ]; then
                      echo "::error::no version found" && exit 1
                    fi
                    echo "version=$version" >> "$GITHUB_OUTPUT"

    changes:
        runs-on: ubuntu-latest
        outputs:
            code: ${{ steps.changes.outputs.code }}
            docs: ${{ steps.changes.outputs.docs }}
            tooling: ${{ steps.changes.outputs.tooling }}
        steps:
            -   uses: actions/checkout@v7
                if: github.event_name == 'pull_request'
                with:
                    ref: ${{ github.event.pull_request.head.sha }}
                    fetch-depth: 0

            -   name: Changed files
                id: changes
                env:
                    EVENT: ${{ github.event_name }}
                    BASE: ${{ github.event.pull_request.base.ref }}
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                    HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                #language=bash
                run: |
                    if [ "$EVENT" != pull_request ]; then
                      echo "code=true" >> "$GITHUB_OUTPUT"
                      echo "tooling=true" >> "$GITHUB_OUTPUT"
                      exit 0
                    fi
                    files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
                    code=false
                    if [ "$BASE" = main ] || grep -v '^docs/' <<< "$files" | grep -q .; then code=true; fi
                    docs=false
                    if grep -q '^docs/' <<< "$files"; then docs=true; fi
                    tooling=false
                    if grep -q '^tools/' <<< "$files" || grep -qxE 'go\.(mod|sum)' <<< "$files"; then tooling=true; fi
                    echo "code=$code" >> "$GITHUB_OUTPUT"
                    echo "docs=$docs" >> "$GITHUB_OUTPUT"
                    echo "tooling=$tooling" >> "$GITHUB_OUTPUT"

    docs:
        name: Docs
        needs: changes
        if: needs.changes.outputs.docs == 'true'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ github.event.pull_request.head.sha }}
            -   uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod

            -   name: Check
                run: go run ./tools/docslint

    go-test:
        name: Go tests (${{ matrix.name }})
        needs: [ version, changes ]
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: macOS
                        os: macos-26
                        flags: -race
                    -   name: Windows
                        os: windows-2025
                        flags: ""
                    -   name: Linux
                        os: ubuntu-24.04
                        flags: -race
                    -   name: Linux arm64
                        os: ubuntu-24.04-arm
                        flags: -race
        runs-on: ${{ matrix.os }}
        env:
            CODE: ${{ needs.changes.outputs.code }}
        steps:
            -   uses: actions/checkout@v7
                if: env.CODE == 'true'
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   uses: actions/setup-go@v7
                if: env.CODE == 'true'
                with:
                    go-version-file: go.mod

            -   name: Vet
                if: env.CODE == 'true'
                shell: bash
                run: go vet $(go list ./... | grep -v '^flock/tools/')

            -   name: Test
                if: env.CODE == 'true'
                shell: bash
                run: go test ${{ matrix.flags }} $(go list ./... | grep -v '^flock/tools/')

            -   name: Third-party notices
                if: env.CODE == 'true' && matrix.name == 'macOS'
                run: go run ./tools/notices -check

            # The apps' translation files are what lang/ and the apps' keys generate; run `make i18n`
            # after changing either.
            -   name: Translations
                if: env.CODE == 'true' && matrix.name == 'macOS'
                run: go run ./tools/i18n -check

            # How much of each language is translated, in the job's summary. A pull request that changes
            # the English of an existing key gets a reminder: a new meaning needs a new key (lang/README.md).
            -   name: Translation status
                if: env.CODE == 'true' && matrix.name == 'macOS'
                env:
                    BASE_SHA: ${{ github.event.pull_request.base.sha }}
                #language=bash
                run: |
                    { echo '### Translations'; echo '```'; go run ./tools/i18n -status; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
                    [ -n "$BASE_SHA" ] || exit 0
                    git fetch --quiet --depth=1 origin "$BASE_SHA"
                    git show "$BASE_SHA:lang/en/app.json" > "$RUNNER_TEMP/en.json" 2>/dev/null || exit 0
                    changed=$(go run ./tools/i18n -changed "$RUNNER_TEMP/en.json")
                    [ -n "$changed" ] || exit 0
                    echo "::warning title=English texts changed::If a text's meaning changed, give it a new key so translators see it (lang/README.md)."
                    {
                      echo '### English texts changed'
                      echo "If a text's meaning changed, give it a new key, so translators see it (lang/README.md)."
                      echo '```'
                      echo "$changed"
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"

    tool-test:
        name: Tool tests
        needs: changes
        if: needs.changes.outputs.tooling == 'true'
        runs-on: ubuntu-24.04
        steps:
            -   uses: actions/checkout@v7
                with:
                    ref: ${{ inputs.ref || github.event.pull_request.head.sha }}

            -   uses: actions/setup-go@v7
                with:
                    go-version-file: go.mod

            -   name: Vet
                run: go vet ./tools/...

            -   name: Test
                run: go test ./tools/...

    macos:
        needs: [ version, changes ]
        uses: ./.github/workflows/ci-macos.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ needs.changes.outputs.code }}
        secrets: inherit

    windows:
        needs: [ version, changes ]
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/ci-windows.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ needs.changes.outputs.code }}
        secrets: inherit

    linux:
        needs: [ version, changes ]
        uses: ./.github/workflows/ci-linux.yml
        with:
            ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
            version: ${{ needs.version.outputs.version }}
            code: ${{ needs.changes.outputs.code }}
