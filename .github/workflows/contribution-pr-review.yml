# Applies the initial and re-requested review labels to pull requests from the trusted default branch.
name: PR Review Labels

on:
    # pull_request_target runs from the default branch. It never checks out or runs pull request code.
    pull_request_target:
        types: [ opened, review_requested ]

permissions:
    contents: read
    pull-requests: read
    issues: write

# Queue every label write for one pull request. A later run must not replace a pending review request.
# workflow_run has no pull request number for forks, so the key is the head repository and branch.
# Both review-label workflows include those fields.
concurrency:
    group: pr-review-${{ github.event.pull_request.head.repo.owner.login || github.event.workflow_run.head_repository.owner.login }}-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
    queue: max

jobs:
    label:
        name: Review Requested
        runs-on: ubuntu-latest
        steps:
            # Check out the trusted default branch; never check out or run pull request code here.
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
                with:
                    ref: ${{ github.event.repository.default_branch }}

            -   uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
                with:
                    go-version-file: go.mod

            -   name: Pull Request Review
                run: go run ./tools/github pr-review
                env:
                    GITHUB_TOKEN: ${{ github.token }}
