# Releases a beta of develop: "Run workflow" in the Actions tab with "Use workflow from" set to
# develop (or `gh workflow run beta.yml --ref develop`). A maintenance branch like 1.x can have
# betas too. Nothing is released by pushing; a beta exists only when this runs.
#
#   1. tools/release works out the version from the branch's commits since its last stable
#      release, as release-please will: 1.1.0-beta.1, then 1.1.0-beta.2, ... (never lower than a
#      beta of the same major version already released).
#   2. build.yml builds and signs it, like a stable release.
#   3. It is tagged (v1.1.0-beta.1) and published as a GitHub pre-release with its notes, and added
#      to the update feed: apps with "Beta versions" on offer it, and so do betas until the release
#      they lead to; others don't.
#
# A beta that works is released as stable with promote.yml.
name: Beta release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      # Anyone with write access can start a workflow; only admins may release.
      - name: Check who started it
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          if [ "$permission" != admin ]; then
            echo "::error::only admins can run this, not $ACTOR ($permission)" && exit 1
          fi

      - name: Check the branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if ! [[ "$BRANCH" =~ ^(develop|[0-9]+\.x)$ ]]; then
            echo "::error::betas are released from develop (Run workflow → Use workflow from → develop) or a maintenance branch like 1.x, not \"$BRANCH\"" && exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The tags, to count from the last release and the betas since.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          version=$(go run ./tools/release beta-version)
          echo "Releasing $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
      # Windows signing's Azure login.
      id-token: write
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ needs.prepare.outputs.version }}
    # The "release" environment's signing secrets: a called workflow sees them only when passed on.
    secrets: inherit

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    # SPARKLE_PRIVATE_KEY, which signs the macOS update.
    environment: release
    permissions:
      contents: write
    concurrency:
      # One writer of the update feed at a time (release.yml writes it too).
      group: update-feed
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SHA: ${{ needs.prepare.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        run: |
          go run ./tools/release notes > "$RUNNER_TEMP/notes.md"
          for f in "dist/Flock-$VERSION-macOS.dmg" "dist/Flock-Setup-$VERSION-x64.exe"; do
            [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          done
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --latest=false \
            --title "Flock $VERSION" --notes-file "$RUNNER_TEMP/notes.md" dist/*

      - uses: ./.github/actions/update-feed
        with:
          version: ${{ env.VERSION }}
          notes: ${{ runner.temp }}/notes.md
          private-key: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          token: ${{ github.token }}
