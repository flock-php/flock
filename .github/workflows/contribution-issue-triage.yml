# Issues opened by people without repository access need a maintainer's first review.
name: Issue Triage

on:
  issues:
    types: [ opened, assigned ]

permissions:
  contents: read
  issues: write

jobs:
  label:
    name: Label for triage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Triage
        if: github.event.action == 'opened'
        run: go run ./tools/github issue triage
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assignment
        if: github.event.action == 'assigned'
        run: go run ./tools/github issue assignment
        env:
          GITHUB_TOKEN: ${{ github.token }}
