name: Feature request
description: An idea or something Flock should do.
type: Feature
body:
    -   type: textarea
        id: problem
        attributes:
            label: The problem
            description: What are you trying to do, and what gets in the way?
        validations:
            required: true

    -   type: textarea
        id: solution
        attributes:
            label: The solution you'd like
        validations:
            required: true

    -   type: textarea
        id: alternatives
        attributes:
            label: Alternatives you've considered
