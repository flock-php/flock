name: Bug report
description: Something in Flock doesn't work as it should.
type: Bug
body:
    -   type: dropdown
        id: platform
        attributes:
            label: Platform
            description: Where does it happen? The issue is labelled by your answer.
            multiple: true
            options:
                - macOS
                - Windows
                - Linux
        validations:
            required: true

    -   type: input
        id: version
        attributes:
            label: Flock version
            description: Run `flock version`.
            placeholder: 1.0.0
        validations:
            required: true

    -   type: input
        id: os-version
        attributes:
            label: OS version
            placeholder: macOS 26.1, Windows 11 24H2, Ubuntu 24.04
        validations:
            required: true

    -   type: textarea
        id: what-happened
        attributes:
            label: What happened?
            description: What did you expect to happen instead?
        validations:
            required: true

    -   type: textarea
        id: steps
        attributes:
            label: Steps to reproduce
            placeholder: |
                1. Link a site with `flock link`
                2. Open it in the browser
                3. …
        validations:
            required: true

    -   type: textarea
        id: logs
        attributes:
            label: Logs
            description: The output of `flock status`, and `flock logs daemon` or the log of the service involved, if it helps.
            render: text
